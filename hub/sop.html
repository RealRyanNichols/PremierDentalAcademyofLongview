<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>SOP | Onboarding Hub</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; color: #0f172a; -webkit-font-smoothing: antialiased; }
    :focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .animate-pulse { animation: none; } }
    @media (max-width: 779.9px) { body { padding-bottom: 64px; } }
    @media (min-width: 780px) { #hub-bottombar { display: none; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/hub/hub-app.js"></script>
  <style media="print">
    #hub-topbar, #hub-bottombar, .no-print { display: none !important; }
    body { background: #fff; padding-bottom: 0; }
    .print-card { border: 1px solid #cbd5e1 !important; break-inside: avoid; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <header id="hub-topbar" class="bg-white border-b border-slate-200 sticky top-0 z-50"></header>
  <main id="hub-main" class="max-w-4xl mx-auto px-4 py-6">
    <div class="space-y-3" aria-label="Loading">
      <div class="animate-pulse bg-slate-200 rounded-xl h-16"></div>
      <div class="animate-pulse bg-slate-200 rounded-xl h-16"></div>
      <div class="animate-pulse bg-slate-200 rounded-xl h-16"></div>
    </div>
    <noscript><p class="bg-amber-50 border border-amber-300 rounded-xl p-4 mt-4">The hub needs JavaScript. Please enable it and refresh.</p></noscript>
  </main>
  <nav id="hub-bottombar" aria-label="Hub navigation" class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-50"></nav>
  
<script>

HUB.init({}, function (state) {
  if (!state.membership) return;
  var id = new URLSearchParams(location.search).get('id');
  if (!id) { HUB.screen(null, HUB.denied('No SOP selected.')); return; }
  var canEdit = ['owner', 'manager', 'trainer'].indexOf(state.membership.role) !== -1;
  load();

  function load() {
    HUB.screen(null, HUB.skeleton(4));
    HUB.from('hub_sops').select('*').eq('id', id).maybeSingle().then(function (r) {
      if (r.error) throw new Error(r.error.message);
      if (!r.data) { HUB.screen(null, HUB.denied('That SOP doesn\'t exist (or was archived).')); return; }
      render(r.data);
    }).catch(function (err) { var m = HUB.screen(null, ''); m.appendChild(HUB.errorState(err, load)); });
  }

  function render(sop) {
    var steps = Array.isArray(sop.body) ? sop.body : [];
    var tray = !Array.isArray(sop.body) && sop.body && sop.body.tray ? sop.body.tray : null;
    if (!tray && steps.length && steps[0] && steps[0].tray) { tray = steps[0].tray; steps = steps.slice(1); }
    var html = '<p class="text-sm no-print"><a class="text-sky-700 hover:underline" href="/hub/sops">← All SOPs</a></p>' +
      '<div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 mt-3 print-card">' +
      '<div class="flex flex-wrap items-start justify-between gap-3">' +
      '<div><h1 class="font-bold text-2xl">' + HUB.esc(sop.title) + '</h1>' +
      '<p class="text-slate-500 text-sm mt-1">v' + sop.version + ' · last reviewed ' + HUB.esc(HUB.fmtDate(sop.last_reviewed_at)) + ' · ' + HUB.esc(HUB.state.org.name) + '</p></div>' +
      '<div class="no-print flex gap-2">' +
      '<button type="button" onclick="window.print()" class="border border-slate-300 hover:border-slate-400 font-semibold px-4 py-2 rounded-lg text-sm">Print</button>' +
      (canEdit ? '<button type="button" id="edit-sop" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold px-4 py-2 rounded-lg text-sm">Edit</button>' : '') +
      '</div></div>';
    if (tray) {
      html += '<h2 class="font-bold mt-6">Tray layout</h2><div class="overflow-x-auto"><table class="mt-2 w-full text-sm border border-slate-200 rounded-lg">' +
        '<thead><tr class="bg-slate-50 text-left"><th class="px-3 py-2 font-semibold">Item</th><th class="px-3 py-2 font-semibold">Position</th></tr></thead><tbody>';
      tray.forEach(function (row) {
        html += '<tr class="border-t border-slate-100"><td class="px-3 py-2">' + HUB.esc(row[0]) + '</td><td class="px-3 py-2 text-slate-500">' + HUB.esc(row[1]) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    if (steps.length) {
      html += '<h2 class="font-bold mt-6">Steps</h2><ol class="mt-2 space-y-2 list-decimal pl-5">';
      steps.forEach(function (s) { html += '<li class="text-slate-700">' + HUB.esc(s.step || s) + '</li>'; });
      html += '</ol>';
    }
    html += '<p class="text-slate-400 text-xs mt-8">Internal training document for ' + HUB.esc(HUB.state.org.name) + '. Not a certification, license, or substitute for state-required training.</p></div>';
    var m = HUB.screen(null, html);
    if (canEdit) {
      var eb = HUB.$('#edit-sop', m);
      if (eb) eb.addEventListener('click', function () { editFlow(sop, steps, tray); });
    }
  }

  function editFlow(sop, steps, tray) {
    var panel = HUB.el('div', { class: 'fixed inset-0 bg-slate-900/50 z-[80] flex items-center justify-center p-4 overflow-y-auto' });
    panel.innerHTML = '<div role="dialog" aria-modal="true" aria-labelledby="es-title" class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl my-8">' +
      '<h2 id="es-title" class="font-bold text-lg">Edit SOP <span class="text-slate-400 font-normal">(saves as v' + (sop.version + 1) + ')</span></h2>' +
      '<label class="block font-semibold text-sm mt-4" for="es-t">Title</label>' +
      '<input id="es-t" type="text" maxlength="150" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2" value="' + HUB.esc(sop.title) + '">' +
      '<label class="block font-semibold text-sm mt-3" for="es-steps">Steps — one per line</label>' +
      '<textarea id="es-steps" rows="10" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2">' + HUB.esc(steps.map(function (s) { return s.step || s; }).join('\n')) + '</textarea>' +
      (tray ? '<p class="text-xs text-slate-500 mt-2">The tray layout table is kept as-is when you save.</p>' : '') +
      '<div id="es-retry"></div>' +
      '<div class="mt-5 flex justify-end gap-3">' +
      '<button type="button" id="es-cancel" class="px-4 py-2 rounded-lg border border-slate-300 font-semibold text-sm">Cancel</button>' +
      '<button type="button" id="es-ok" class="px-4 py-2 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-semibold text-sm">Save as new version</button></div></div>';
    document.body.appendChild(panel);
    var dlg = panel.firstChild;
    function close() { panel.remove(); document.removeEventListener('keydown', esc, true); }
    function esc(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', esc, true);
    HUB.$('#es-cancel', dlg).addEventListener('click', close);
    HUB.$('#es-t', dlg).focus();
    HUB.$('#es-ok', dlg).addEventListener('click', function () {
      var newSteps = HUB.$('#es-steps', dlg).value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean)
        .map(function (s) { return { step: s }; });
      var body = tray ? [{ tray: tray }].concat(newSteps) : newSteps;
      HUB.withRetry(HUB.$('#es-retry', dlg), function () {
        return HUB.from('hub_sops').update({
          title: HUB.$('#es-t', dlg).value.trim() || sop.title,
          body: body, version: sop.version + 1, last_reviewed_at: new Date().toISOString().slice(0, 10),
        }).eq('id', sop.id).then(function (r) { if (r.error) throw new Error(r.error.message); });
      }).then(function () { HUB.toast('Saved as v' + (sop.version + 1) + '.'); close(); load(); });
    });
  }
});

</script>
</body>
</html>

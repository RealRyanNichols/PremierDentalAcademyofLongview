<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Readiness report | Onboarding Hub</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; color: #0f172a; -webkit-font-smoothing: antialiased; }
    :focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .animate-pulse { animation: none; } }
    @media (max-width: 779.9px) { body { padding-bottom: 64px; } }
    @media (min-width: 780px) { #hub-bottombar { display: none; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/hub/hub-app.js"></script>
  <style media="print">
    #hub-topbar, #hub-bottombar, .no-print { display: none !important; }
    body { background: #fff; padding-bottom: 0; }
    .print-card { border: 1px solid #cbd5e1 !important; break-inside: avoid; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <header id="hub-topbar" class="bg-white border-b border-slate-200 sticky top-0 z-50"></header>
  <main id="hub-main" class="max-w-4xl mx-auto px-4 py-6">
    <div class="space-y-3" aria-label="Loading">
      <div class="animate-pulse bg-slate-200 rounded-xl h-16"></div>
      <div class="animate-pulse bg-slate-200 rounded-xl h-16"></div>
      <div class="animate-pulse bg-slate-200 rounded-xl h-16"></div>
    </div>
    <noscript><p class="bg-amber-50 border border-amber-300 rounded-xl p-4 mt-4">The hub needs JavaScript. Please enable it and refresh.</p></noscript>
  </main>
  <nav id="hub-bottombar" aria-label="Hub navigation" class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-50"></nav>
  
<script>

HUB.init({ roles: ['owner', 'manager', 'trainer'] }, function (state) {
  if (!state.membership || ['owner','manager','trainer'].indexOf(state.membership.role) === -1) return;
  var empId = new URLSearchParams(location.search).get('e');
  if (!empId) { HUB.screen(null, HUB.denied('No employee selected.')); return; }
  var DISCLAIMER = 'This is an internal training record kept by your practice. It is not a certification, license, HIPAA or OSHA credential, or a substitute for state-required training. In Texas, x-ray positioning and exposure require the TSBDE RDA radiology certificate.';
  load();

  function load() {
    HUB.screen(null, HUB.skeleton(6));
    Promise.all([
      HUB.rpc('hub_org_people', { p_org: state.orgId }),
      HUB.from('hub_plans').select('*').eq('employee_membership_id', empId).order('created_at', { ascending: false }).limit(1),
      HUB.from('hub_employee_skills').select('state, note, recheck_at, signed_off_at, hub_skills(title, category)').eq('employee_membership_id', empId),
      HUB.from('hub_quiz_attempts').select('score_pct, passed, at, hub_quizzes(title)').eq('employee_membership_id', empId).order('at', { ascending: false }),
      HUB.from('hub_checkins').select('week_of, wins, needs, next_plan').eq('employee_membership_id', empId).order('week_of', { ascending: false }).limit(6),
    ]).then(function (r) {
      var emp = (r[0] || []).find(function (p) { return p.membership_id === empId; });
      var plan = (r[1].data || [])[0];
      if (!emp) { HUB.screen(null, HUB.denied('That person isn\'t in this workspace.')); return; }
      if (!plan) { HUB.screen(null, HUB.denied('No plan yet — start one from the home screen first.')); return; }
      HUB.from('hub_plan_tasks').select('phase, status, kind').eq('plan_id', plan.id).then(function (tr) {
        build(emp, plan, tr.data || [], r[2].data || [], r[3].data || [], r[4].data || []);
      });
    }).catch(function (err) { var m = HUB.screen(null, ''); m.appendChild(HUB.errorState(err, load)); });
  }

  function build(emp, plan, tasks, skills, quizzes, checkins) {
    var phases = ['d30', 'd60', 'd90'].map(function (ph) {
      var pts = tasks.filter(function (t) { return t.phase === ph; });
      var done = pts.filter(function (t) { return t.status === 'done'; }).length;
      return { phase: ph, done: done, total: pts.length };
    });
    var byState = { independent: [], practicing: [], observed: [], needs_coaching: [], not_started: [] };
    skills.forEach(function (s) { (byState[s.state] = byState[s.state] || []).push(s); });
    var totalDone = tasks.filter(function (t) { return t.status === 'done'; }).length;
    var pct = tasks.length ? Math.round(totalDone * 100 / tasks.length) : 0;

    var snapshot = {
      employee: emp.full_name || emp.email, title: emp.title,
      start_date: plan.start_date, progress_pct: pct,
      phases: phases,
      skills: { independent: byState.independent.length, practicing: byState.practicing.length,
        observed: byState.observed.length, needs_coaching: byState.needs_coaching.length,
        not_started: byState.not_started.length },
      quizzes: quizzes.map(function (q) { return { title: q.hub_quizzes && q.hub_quizzes.title, score: q.score_pct, passed: q.passed }; }),
    };
    HUB.rpc('hub_save_report', { p_org: state.orgId, p_employee_membership: empId, p_snapshot: snapshot })
      .then(function (reportId) { HUB.track('report_generated', {}, 'report_generated:' + reportId); })
      .catch(function () { /* the on-screen report still renders */ });

    var PH_TITLES = { d30: 'Days 1–30', d60: 'Days 31–60', d90: 'Days 61–90' };
    var html = '<div class="no-print flex items-center justify-between gap-3 mt-1">' +
      '<p class="text-sm"><a class="text-sky-700 hover:underline" href="/hub/plan?e=' + empId + '">← Plan</a></p>' +
      '<button type="button" onclick="window.print()" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold px-4 py-2 rounded-lg text-sm">Print report</button></div>';
    html += '<div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-10 mt-3 print-card">' +
      '<p class="text-[11px] uppercase tracking-widest text-slate-400 font-bold">Readiness report · ' + HUB.esc(HUB.state.org.name) + '</p>' +
      '<h1 class="font-bold text-3xl mt-1.5">' + HUB.esc(emp.full_name || emp.email) + '</h1>' +
      '<p class="text-slate-500 mt-1">' + HUB.esc(emp.title || 'New hire') + ' · started ' + HUB.esc(HUB.fmtDate(plan.start_date)) + ' · generated ' + HUB.esc(HUB.fmtDate(new Date().toISOString())) + '</p>';

    html += '<h2 class="font-bold text-lg mt-8">Plan progress — ' + pct + '%</h2><div class="mt-3 grid sm:grid-cols-3 gap-3">';
    phases.forEach(function (p) {
      var ppct = p.total ? Math.round(p.done * 100 / p.total) : 0;
      html += '<div class="border border-slate-200 rounded-xl p-4 print-card"><p class="font-semibold text-sm">' + PH_TITLES[p.phase] + '</p>' +
        '<p class="text-2xl font-bold text-sky-700 mt-1">' + p.done + '<span class="text-slate-400 text-base font-semibold">/' + p.total + '</span></p>' +
        '<div class="mt-2 bg-slate-100 rounded-full h-2"><div class="bg-sky-500 h-2 rounded-full" style="width:' + ppct + '%"></div></div></div>';
    });
    html += '</div>';

    html += '<h2 class="font-bold text-lg mt-8">Skills</h2>';
    var groups = [['independent', 'Independent', 'text-emerald-700'], ['practicing', 'Practicing', 'text-amber-700'],
      ['observed', 'Observed', 'text-sky-700'], ['needs_coaching', 'Needs coaching', 'text-red-700']];
    groups.forEach(function (g) {
      var list = byState[g[0]] || [];
      if (!list.length) return;
      html += '<h3 class="font-semibold mt-4 ' + g[2] + '">' + g[1] + ' (' + list.length + ')</h3><ul class="mt-1.5 text-sm text-slate-700 space-y-1">';
      list.forEach(function (s) {
        html += '<li>• ' + HUB.esc(s.hub_skills ? s.hub_skills.title : '') +
          (g[0] === 'needs_coaching' ? ' <span class="text-slate-500">(' + (s.recheck_at ? 're-check ' + HUB.esc(HUB.fmtDate(s.recheck_at)) : 're-check pending') + (s.note ? ' — ' + HUB.esc(s.note) : '') + ')</span>' : '') + '</li>';
      });
      html += '</ul>';
    });
    if (!skills.length) html += '<p class="text-slate-500 text-sm mt-2">No skills recorded yet.</p>';

    if (quizzes.length) {
      html += '<h2 class="font-bold text-lg mt-8">Knowledge checks</h2><ul class="mt-2 text-sm text-slate-700 space-y-1">';
      quizzes.forEach(function (q) {
        html += '<li>• ' + HUB.esc(q.hub_quizzes ? q.hub_quizzes.title : 'Quiz') + ': ' + q.score_pct + '% ' +
          (q.passed ? '<span class="text-emerald-700 font-semibold">passed</span>' : '<span class="text-red-700 font-semibold">not yet</span>') +
          ' <span class="text-slate-400">(' + HUB.esc(HUB.fmtDate(q.at)) + ')</span></li>';
      });
      html += '</ul>';
    }

    if (checkins.length) {
      html += '<h2 class="font-bold text-lg mt-8">Recent check-ins</h2><ul class="mt-2 space-y-2.5">';
      checkins.forEach(function (c) {
        html += '<li class="border border-slate-200 rounded-xl p-3.5 text-sm print-card"><p class="font-semibold">Week of ' + HUB.esc(HUB.fmtDate(c.week_of)) + '</p>' +
          (c.wins ? '<p class="mt-0.5"><span class="font-semibold">Wins:</span> ' + HUB.esc(c.wins) + '</p>' : '') +
          (c.needs ? '<p class="mt-0.5"><span class="font-semibold">Needs:</span> ' + HUB.esc(c.needs) + '</p>' : '') +
          '<p class="mt-0.5"><span class="font-semibold">Next:</span> ' + HUB.esc(c.next_plan) + '</p></li>';
      });
      html += '</ul>';
    }

    html += '<p class="text-slate-400 text-xs mt-10 border-t border-slate-100 pt-4">' + DISCLAIMER + '</p></div>';
    HUB.screen(null, html);
  }
});

</script>
</body>
</html>

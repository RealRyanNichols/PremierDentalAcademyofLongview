<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Set up your workspace | Onboarding Hub</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; color: #0f172a; -webkit-font-smoothing: antialiased; }
    :focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .animate-pulse { animation: none; } }
    @media (max-width: 779.9px) { body { padding-bottom: 64px; } }
    @media (min-width: 780px) { #hub-bottombar { display: none; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/hub/hub-app.js"></script>

</head>
<body class="bg-slate-50 min-h-screen">
  <header id="hub-topbar" class="bg-white border-b border-slate-200 sticky top-0 z-50"></header>
  <main id="hub-main" class="max-w-4xl mx-auto px-4 py-6">
    <div class="space-y-3" aria-label="Loading">
      <div class="animate-pulse bg-slate-200 rounded-xl h-16"></div>
      <div class="animate-pulse bg-slate-200 rounded-xl h-16"></div>
      <div class="animate-pulse bg-slate-200 rounded-xl h-16"></div>
    </div>
    <noscript><p class="bg-amber-50 border border-amber-300 rounded-xl p-4 mt-4">The hub needs JavaScript. Please enable it and refresh.</p></noscript>
  </main>
  <nav id="hub-bottombar" aria-label="Hub navigation" class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-50"></nav>
  
<script>

HUB.init({ needsOrg: false }, function (state) {
  if (!state.session) return;
  // If they already belong to a workspace, setup is done.
  HUB.from('hub_org_memberships').select('id').eq('status', 'active').limit(1).then(function (r) {
    if (!r.error && r.data && r.data.length) { location.replace('/hub'); return; }
    render();
  });
  function render() {
    var m = HUB.screen(null,
      '<div class="max-w-lg mx-auto mt-6">' +
      '<h1 class="font-bold text-2xl">Set up your practice workspace</h1>' +
      '<p class="text-slate-600 mt-2">Two questions and you\'re in. You can change both later in Settings.</p>' +
      '<form id="setup-form" class="mt-6 bg-white border border-slate-200 rounded-2xl p-6">' +
      '<label class="block font-semibold text-sm" for="org-name">Practice name</label>' +
      '<input id="org-name" type="text" required maxlength="120" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5" placeholder="e.g. Sunrise Family Dental">' +
      '<p id="name-err" class="text-red-700 text-sm mt-1 hidden" role="alert"></p>' +
      '<label class="block font-semibold text-sm mt-4" for="org-type">Practice type</label>' +
      '<select id="org-type" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white">' +
      '<option>General dentistry</option><option>Pediatric</option><option>Orthodontics</option>' +
      '<option>Oral surgery</option><option>Multi-specialty / group</option></select>' +
      '<button type="submit" class="mt-6 w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold px-5 py-3 rounded-xl">Create workspace</button>' +
      '<p class="text-slate-500 text-xs mt-4">Free to start: one active onboarding at a time, full checklist and SOPs included. No card needed.</p>' +
      '</form></div>');
    var form = HUB.$('#setup-form', m);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = HUB.$('#org-name', m).value.trim();
      var err = HUB.$('#name-err', m);
      err.classList.add('hidden');
      if (!name) { err.textContent = 'Give your practice a name.'; err.classList.remove('hidden'); return; }
      HUB.withRetry(form, function () {
        return HUB.rpc('hub_create_workspace', { p_name: name, p_practice_type: HUB.$('#org-type', m).value });
      }).then(function (orgId) {
        try { localStorage.setItem('hub_org', orgId); } catch (e2) {}
        HUB.state.orgId = orgId;
        HUB.track('workspace_started', { practice_type: HUB.$('#org-type', m).value }, 'workspace_started:' + orgId);
        HUB.toast('Workspace created — welcome!');
        location.href = '/hub';
      });
    });
  }
});

</script>
</body>
</html>

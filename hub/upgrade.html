<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Upgrade | Onboarding Hub</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; color: #0f172a; -webkit-font-smoothing: antialiased; }
    :focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .animate-pulse { animation: none; } }
    @media (max-width: 779.9px) { body { padding-bottom: 64px; } }
    @media (min-width: 780px) { #hub-bottombar { display: none; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/hub/hub-app.js"></script>

</head>
<body class="bg-slate-50 min-h-screen">
  <header id="hub-topbar" class="bg-white border-b border-slate-200 sticky top-0 z-50"></header>
  <main id="hub-main" class="max-w-4xl mx-auto px-4 py-6">
    <div class="space-y-3" aria-label="Loading">
      <div class="animate-pulse bg-slate-200 rounded-xl h-16"></div>
      <div class="animate-pulse bg-slate-200 rounded-xl h-16"></div>
      <div class="animate-pulse bg-slate-200 rounded-xl h-16"></div>
    </div>
    <noscript><p class="bg-amber-50 border border-amber-300 rounded-xl p-4 mt-4">The hub needs JavaScript. Please enable it and refresh.</p></noscript>
  </main>
  <nav id="hub-bottombar" aria-label="Hub navigation" class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-50"></nav>
  
<script>

HUB.init({}, function (state) {
  if (!state.orgId) return;
  HUB.track('upgrade_viewed', {}, 'upgrade_viewed:' + state.orgId + ':' + new Date().toISOString().slice(0, 10));
  HUB.screen(null,
    '<div class="max-w-lg mx-auto mt-6 text-center">' +
    '<h1 class="font-bold text-2xl">Onboard your whole team</h1>' +
    '<p class="text-slate-600 mt-3">The free workspace runs one active onboarding at a time — perfect for trying the hub with a single hire. The full version removes that limit and keeps every plan, sign-off, and report in one place as your team grows.</p>' +
    '<div class="bg-white border border-slate-200 rounded-2xl p-8 mt-6">' +
    '<p class="font-semibold text-lg">Pricing is being finalized — talk to Premier.</p>' +
    '<p class="text-slate-600 mt-2 text-sm">We\'ll walk you through what\'s coming and set your office up personally.</p>' +
    '<div class="mt-5 flex flex-col sm:flex-row justify-center gap-3">' +
    '<a href="tel:+19039136444" class="bg-slate-900 hover:bg-slate-700 text-white font-semibold px-5 py-3 rounded-xl">Call or text (903) 913-6444</a>' +
    '<a href="mailto:hello@premierdentalacademyoflongview.com?subject=Onboarding%20hub%20upgrade" class="border border-slate-300 hover:border-slate-400 font-semibold px-5 py-3 rounded-xl">Email us</a>' +
    '</div></div>' +
    '<p class="text-slate-500 text-sm mt-6"><a class="text-sky-700 font-semibold hover:underline" href="/hub">← Back to home</a></p></div>');
});

</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>My Courses — Premier Dental Academy of Longview</title>
  <meta name="description" content="Your Premier Dental Academy courses — video lessons, quizzes, and hands-on trainers, all in one place." />
  <link rel="canonical" href="https://www.premierdentalacademyoflongview.com/learn" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/pda-portal-guard.js"></script>
  <script src="/assets/tooth-shapes.js" defer></script>
  <script src="/assets/pda-odontogram.js" defer></script>
  <script src="/assets/pda-nav.js" defer></script>
  <script defer src="/assets/student-nav.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; color: #0f172a; -webkit-font-smoothing: antialiased; }
    .display { font-family: 'Fraunces', serif; }
    .gradient-text { background: linear-gradient(90deg,#2dd4bf 0%,#22d3ee 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    #app { display: none; }
    body.pda-ready #app { display: block; }
    body.pda-ready #gate-loading { display: none; }
    .card { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .card:hover { transform: translateY(-3px); }
    .lesson-body { line-height: 1.7; }
    .lesson-body h2 { font-weight: 700; font-size: 1.25rem; margin: 1.25rem 0 .5rem; }
    .lesson-body h3 { font-weight: 700; margin: 1rem 0 .35rem; }
    .lesson-body p { margin: .6rem 0; }
    .lesson-body ul { list-style: disc; padding-left: 1.4rem; margin: .6rem 0; }
    .lesson-body ol { list-style: decimal; padding-left: 1.4rem; margin: .6rem 0; }
    .lesson-body a { color: #0d9488; text-decoration: underline; }
    .lesson-body img, .lesson-body iframe, .lesson-body table { max-width: 100%; }
    .aspect-video-box { position: relative; padding-top: 56.25%; }
    .aspect-video-box > * { position: absolute; inset: 0; width: 100%; height: 100%; }
    /* Journey */
    .week { position: relative; }
    .week + .week::before { content: ''; position: absolute; left: 27px; top: -22px; height: 22px; border-left: 2px dashed #cbd5e1; }
    .week[open] summary .chev { transform: rotate(90deg); }
    .week summary { list-style: none; cursor: pointer; }
    .week summary::-webkit-details-marker { display: none; }
    .ring { --p: 0; width: 44px; height: 44px; border-radius: 9999px; background: conic-gradient(#0d9488 calc(var(--p) * 1%), #e2e8f0 0); display: grid; place-items: center; flex-shrink: 0; }
    .ring > span { width: 34px; height: 34px; border-radius: 9999px; background: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #0f766e; }
    .ring.done { background: #0d9488; } .ring.done > span { background: #0d9488; color: #fff; font-size: 16px; }
    .ring.next { box-shadow: 0 0 0 4px #ccfbf1; }
    .pill { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; border-radius: 9999px; padding: 2px 8px; }
    /* Lesson layout */
    .lesson-grid { display: grid; gap: 1.25rem; }
    @media (min-width: 1024px) { .lesson-grid { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } .lesson-side { position: sticky; top: 76px; } }
    .side-row[aria-current="page"] { background: #f0fdfa; border-left: 3px solid #0d9488; }
    .burst { position: fixed; left: 50%; top: 45%; pointer-events: none; z-index: 60; }
    .burst span { position: absolute; font-size: 26px; animation: fly 1.1s ease-out forwards; }
    @keyframes fly { from { transform: translate(0,0) scale(.6); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; } }
    @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
    .pop { animation: pop .3s ease-out; }
    @media (prefers-reduced-motion: reduce) { .card, .week summary .chev { transition: none; } .burst span { display: none; } .pop { animation: none; } }
    .pda-odontogram .surface { cursor: pointer; }
    .pda-odontogram .surface.picked { fill: #99f6e4 !important; stroke: #0d9488 !important; stroke-width: 2.4 !important; }
  </style>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-cyan-50/40 to-teal-50/40 min-h-screen pda-tinted">

<div id="gate-loading" class="min-h-screen flex items-center justify-center text-slate-500 text-sm">
  <div class="text-center">
    <div class="w-8 h-8 border-2 border-teal-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
    Loading your courses…
  </div>
</div>

<main id="app" class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
  <div class="flex items-center justify-between gap-3 mb-5">
    <a href="/" class="flex items-center gap-2 font-bold text-slate-900">
      <img src="/assets/logo-mark.png" alt="PDA" width="36" height="36" class="w-9 h-9 rounded-lg" />
      <span class="text-lg hidden sm:inline">Premier Dental Academy</span>
    </a>
    <nav class="flex items-center gap-4 text-sm font-semibold">
      <a href="/learn" class="text-teal-700 hover:underline">My Courses</a>
      <a href="/dashboard" class="text-slate-600 hover:text-teal-700">Dashboard →</a>
    </nav>
  </div>
  <div id="view"></div>
</main>

<script>
(function () {
  'use strict';
  var SB_URL = 'https://lmbsuwslsycukynzpzik.supabase.co';
  var SB_KEY = 'sb_publishable_vzuQZbkmj-UsYZVs5Zqw9w_c8PiOfbh';
  var sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  var view = document.getElementById('view');
  var access = null, uid = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function qp() { return new URLSearchParams(location.search); }
  function reducedMotion() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function lessonHref(slug, m, l) { return '/learn?c=' + encodeURIComponent(slug) + '&m=' + m + '&l=' + l; }
  function courseHref(slug) { return '/learn?c=' + encodeURIComponent(slug); }
  function firstName() {
    var n = (access && access.first_name) || '';
    if (!n && access && access.email) n = access.email.split('@')[0];
    return n ? n.charAt(0).toUpperCase() + n.slice(1) : 'there';
  }
  function minutesLabel(min) { if (!min) return ''; return min >= 60 ? Math.round(min / 60 * 10) / 10 + ' hr' : min + ' min'; }
  function typeLabel(l) { return l.lesson_type === 'quiz' ? 'Knowledge check' : (l.lesson_type === 'feedback' ? 'Week wrap-up' : (l.lesson_type === 'live' ? 'Live session' : (hasVideo(l) ? 'Video lesson' : 'Reading'))); }
  function hasVideo(l) { return !!(youtubeId(l.video_url) || l.mux_playback_id || l.video_url) && l.lesson_type !== 'quiz'; }
  var SA = 'stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  function lessonIcon(l, completed) {
    if (completed) return '<svg width="20" height="20" viewBox="0 0 24 24" class="text-teal-600"><circle cx="12" cy="12" r="10" fill="currentColor" opacity="0.15"/><path d="M8 12.5l2.5 2.5 5-5.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var lt = l.lesson_type;
    if (lt === 'quiz') return '<svg width="20" height="20" viewBox="0 0 24 24" class="text-violet-500"><rect x="5" y="3" width="14" height="18" rx="2" ' + SA + '/><path d="M9 8h6M9 12h6M9 16h3" ' + SA + '/></svg>';
    if (lt === 'feedback') return '<svg width="20" height="20" viewBox="0 0 24 24" class="text-amber-500"><path d="M21 11.5a8 8 0 01-11.9 7L4 20l1.5-4.6A8 8 0 1121 11.5z" ' + SA + '/></svg>';
    if (lt === 'live') return '<svg width="20" height="20" viewBox="0 0 24 24" class="text-rose-500"><rect x="3" y="6" width="13" height="12" rx="2" ' + SA + '/><path d="M16 10l5-3v10l-5-3" ' + SA + '/></svg>';
    if (hasVideo(l)) return '<svg width="20" height="20" viewBox="0 0 24 24" class="text-teal-600"><circle cx="12" cy="12" r="9" ' + SA + '/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>';
    return '<svg width="20" height="20" viewBox="0 0 24 24" class="text-slate-400"><path d="M7 3h8l4 4v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z" ' + SA + '/><path d="M15 3v4h4M9 12.5h6M9 16h4" ' + SA + '/></svg>';
  }

  // Which courses can this person open?
  function entitledToCourse(c) {
    if (access.is_admin) return true;
    if (c.entitlement_flag === 'career_vault') return access.career_vault === true;
    if (c.entitlement_flag === 'online_program') return !!access.enrolled;
    // No/unknown flag = open to any enrolled member.
    return !!access.enrolled;
  }

  function youtubeId(url) {
    if (!url) return null;
    var m = /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([\w-]{11})/.exec(url);
    return m ? m[1] : null;
  }

  // ---- Data ----
  async function loadCourses() {
    var q = sb.from('courses').select('id,slug,title,description,entitlement_flag,active,sort').order('sort');
    var r = await q;
    return (r.data || []);
  }
  async function loadOutline(slug) {
    var cr = await sb.from('courses').select('*').eq('slug', slug).maybeSingle();
    if (!cr.data) return null;
    var mods = await sb.from('course_modules').select('id,module_number,title,subtitle,unit_label,sort').eq('course_id', cr.data.id).order('sort');
    var modList = mods.data || [];
    var ids = modList.map(function (m) { return m.id; });
    var lessons = ids.length
      ? (await sb.from('course_lessons').select('id,module_id,lesson_number,title,overview,lesson_type,video_url,mux_playback_id,sort,active,estimated_minutes').in('module_id', ids).order('sort')).data || []
      : [];
    return { course: cr.data, modules: modList, lessons: lessons };
  }
  async function loadProgress() {
    if (!uid) return {};
    var r = await sb.from('module_progress').select('module_number,lesson_number,completed_at,quiz_score').eq('student_id', uid);
    var map = {};
    (r.data || []).forEach(function (row) { if (row.completed_at) map[row.module_number + ':' + row.lesson_number] = row; });
    return map;
  }
  // The path through a course: modules in order, each with its visible lessons,
  // plus the totals and the next unfinished lesson ("resume").
  function buildPath(data, progress) {
    var byModule = {};
    data.lessons.forEach(function (l) { (byModule[l.module_id] = byModule[l.module_id] || []).push(l); });
    var weeks = [], total = 0, done = 0, minutesLeft = 0, resume = null, flat = [];
    data.modules.forEach(function (m) {
      var ls = (byModule[m.id] || []).filter(function (l) { return access.is_admin || l.active !== false; }).sort(function (a, b) { return a.sort - b.sort; });
      if (!ls.length) return;
      var wDone = 0, wMin = 0;
      ls.forEach(function (l) {
        var completed = !!progress[m.module_number + ':' + l.lesson_number];
        l._done = completed; l._m = m;
        total++; if (completed) { done++; wDone++; } else { minutesLeft += (l.estimated_minutes || 0); if (!resume) resume = { m: m, l: l }; }
        wMin += (l.estimated_minutes || 0);
        flat.push({ m: m, l: l });
      });
      weeks.push({ m: m, lessons: ls, done: wDone, total: ls.length, minutes: wMin, pct: Math.round(wDone / ls.length * 100) });
    });
    return { weeks: weeks, flat: flat, total: total, done: done, pct: total ? Math.round(done / total * 100) : 0, minutesLeft: minutesLeft, resume: resume };
  }

  // ---- Views ----
  async function renderCatalog() {
    var courses = await loadCourses();
    var mine = courses.filter(entitledToCourse);
    var html = '' +
      '<header class="bg-gradient-to-br from-[#0a1226] to-[#0f2a33] text-white rounded-3xl px-6 sm:px-10 py-8 sm:py-10 mb-6">' +
        '<p class="text-xs uppercase tracking-widest text-teal-300 font-bold">Your Courses</p>' +
        '<h1 class="display text-3xl sm:text-4xl font-extrabold mt-2">Welcome back, <span class="gradient-text">' + esc(firstName()) + '</span> 👋</h1>' +
        '<p class="text-slate-300 mt-2 max-w-xl">Pick up right where you left off. Every lesson you finish shows up on your dashboard, and your instructor sees your progress too.</p>' +
      '</header>';

    if (!mine.length) {
      html += '<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center">' +
        '<div class="text-4xl mb-3">📚</div>' +
        '<h2 class="display text-xl font-bold">No courses on your account yet</h2>' +
        '<p class="text-slate-500 mt-2 text-sm">Once you enroll, your program appears here automatically.</p>' +
        '<div class="mt-5 flex flex-wrap gap-3 justify-center">' +
          '<a href="/enroll" class="bg-teal-700 hover:bg-teal-800 text-white font-semibold px-5 py-2.5 rounded-full text-sm">See enrollment options</a>' +
          '<a href="/dashboard" class="border border-slate-300 hover:border-teal-500 font-semibold px-5 py-2.5 rounded-full text-sm">Go to dashboard</a>' +
        '</div></div>';
      view.innerHTML = html;
      return;
    }

    // Progress for every course at once, so the cards can say exactly where you are.
    var progress = await loadProgress();
    var outlines = await Promise.all(mine.map(function (c) { return loadOutline(c.slug); }));
    var cards = '', hero = '';
    mine.forEach(function (c, i) {
      var data = outlines[i], p = data ? buildPath(data, progress) : null;
      var draft = c.active === false ? '<span class="ml-2 text-[11px] uppercase tracking-wide bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">Draft</span>' : '';
      var status = !p || !p.total ? '<p class="text-sm text-slate-400 mt-3">Lessons are being added.</p>'
        : (p.resume
          ? '<div class="mt-4"><div class="flex items-center justify-between text-xs font-semibold text-slate-500"><span>' + p.done + ' of ' + p.total + ' lessons done</span><span>' + p.pct + '%</span></div>' +
            '<div class="mt-1.5 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-teal-500" style="width:' + p.pct + '%"></div></div>' +
            '<p class="text-xs text-slate-500 mt-3">' + (p.done ? 'Next up' : 'Start with') + ': <span class="font-semibold text-slate-700">Week ' + esc(p.resume.m.module_number) + ' · ' + esc(p.resume.l.title) + '</span></p></div>'
          : '<p class="mt-4 text-sm font-bold text-teal-700">🎉 Course complete</p>');
      var cta = !p || !p.total ? '' : (p.resume
        ? '<a href="' + lessonHref(c.slug, p.resume.m.module_number, p.resume.l.lesson_number) + '" class="inline-block mt-4 bg-teal-700 hover:bg-teal-800 text-white font-bold px-5 py-2.5 rounded-full text-sm">' + (p.done ? 'Continue →' : 'Start course →') + '</a>'
        : '<a href="' + courseHref(c.slug) + '" class="inline-block mt-4 bg-teal-700 hover:bg-teal-800 text-white font-bold px-5 py-2.5 rounded-full text-sm">Review course →</a>');
      cards += '<div class="card bg-white rounded-2xl border border-slate-200 hover:border-teal-500 hover:shadow-lg p-6 flex flex-col">' +
        '<div class="flex items-start justify-between gap-3"><div class="w-11 h-11 rounded-xl bg-teal-50 grid place-items-center text-2xl">' + (c.entitlement_flag === 'career_vault' ? '🗝️' : '🎓') + '</div>' +
        (p && p.total ? '<div class="ring' + (p.pct === 100 ? ' done' : '') + '" style="--p:' + p.pct + '"><span>' + (p.pct === 100 ? '✓' : p.pct + '%') + '</span></div>' : '') + '</div>' +
        '<h3 class="font-bold text-slate-900 leading-snug mt-3"><a href="' + courseHref(c.slug) + '" class="hover:text-teal-700">' + esc(c.title) + '</a>' + draft + '</h3>' +
        '<p class="text-sm text-slate-500 mt-1 line-clamp-3">' + esc(c.description || '') + '</p>' +
        status + '<div class="mt-auto flex items-center gap-4">' + cta + '<a href="' + courseHref(c.slug) + '" class="mt-4 text-sm font-semibold text-slate-500 hover:text-teal-700">See all weeks</a></div>' +
      '</div>';
      // The first course with unfinished work becomes the big "continue" card.
      if (!hero && p && p.resume && p.done) {
        hero = '<a href="' + lessonHref(c.slug, p.resume.m.module_number, p.resume.l.lesson_number) + '" class="card block bg-teal-700 hover:bg-teal-800 text-white rounded-2xl px-6 py-5 mb-6 shadow-lg">' +
          '<p class="text-xs uppercase tracking-widest text-teal-200 font-bold">Continue where you left off</p>' +
          '<p class="display text-xl sm:text-2xl font-extrabold mt-1">' + esc(p.resume.l.title) + ' →</p>' +
          '<p class="text-teal-100 text-sm mt-1">' + esc(c.title) + ' · Week ' + esc(p.resume.m.module_number) + (p.resume.l.estimated_minutes ? ' · about ' + p.resume.l.estimated_minutes + ' min' : '') + '</p></a>';
      }
    });
    html += hero + '<div class="grid sm:grid-cols-2 gap-5">' + cards + '</div>';
    view.innerHTML = html;
  }

  async function renderOutline(slug) {
    var data = await loadOutline(slug);
    if (!data) { view.innerHTML = notFound(); return; }
    if (!entitledToCourse(data.course)) { view.innerHTML = locked(data.course); return; }
    var progress = await loadProgress();
    var p = buildPath(data, progress);
    var resumeWeek = p.resume ? p.resume.m.module_number : null;

    var html = '' +
      '<a href="/learn" class="text-sm text-slate-500 hover:text-teal-700">← All courses</a>' +
      '<div class="mt-3 bg-white rounded-3xl border border-slate-200 p-6 sm:p-8">' +
        '<div class="flex items-start justify-between gap-4 flex-wrap">' +
          '<div class="min-w-0 flex-1"><h1 class="display text-2xl sm:text-3xl font-extrabold">' + esc(data.course.title) + '</h1>' +
          (data.course.description ? '<p class="text-slate-500 mt-2 max-w-2xl">' + esc(data.course.description) + '</p>' : '') + '</div>' +
          (p.total ? '<div class="ring' + (p.pct === 100 ? ' done' : '') + '" style="--p:' + p.pct + ';width:64px;height:64px"><span style="width:50px;height:50px;font-size:14px">' + (p.pct === 100 ? '✓' : p.pct + '%') + '</span></div>' : '') +
        '</div>' +
        (p.total ? '<div class="mt-5 flex items-center gap-4">' +
          '<div class="flex-1 h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-teal-500" style="width:' + p.pct + '%"></div></div>' +
          '<div class="text-sm font-semibold text-slate-700 whitespace-nowrap">' + p.done + ' / ' + p.total + ' done</div>' +
        '</div>' : '') +
        (p.resume
          ? '<div class="mt-5 flex items-center gap-3 flex-wrap"><a href="' + lessonHref(slug, p.resume.m.module_number, p.resume.l.lesson_number) + '" class="inline-block bg-teal-700 hover:bg-teal-800 text-white font-bold px-5 py-3 rounded-full text-sm">' + (p.done ? 'Continue: ' : 'Start: ') + esc(p.resume.l.title) + ' →</a>' +
            '<span class="text-xs text-slate-500">Week ' + esc(p.resume.m.module_number) + (p.minutesLeft ? ' · about ' + minutesLabel(p.minutesLeft) + ' of lessons left in the course' : '') + '</span></div>'
          : (p.total ? '<div class="mt-5 flex items-center gap-3 flex-wrap"><p class="text-teal-700 font-semibold text-sm">🎉 Course complete!</p>' +
            (data.course.cert_enabled !== false ? '<a href="/certificate?c=' + encodeURIComponent(slug) + '" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold px-5 py-2.5 rounded-full text-sm">🎓 Get my certificate →</a>' : '') + '</div>'
            : '<p class="mt-5 text-sm text-slate-400">Lessons are being added. Check back soon.</p>')) +
      '</div>';

    // The journey: weeks grouped under their unit. The current week opens by itself.
    var lastUnit = null;
    html += '<div class="mt-6 space-y-5">';
    p.weeks.forEach(function (w) {
      var m = w.m;
      if (m.unit_label && m.unit_label !== lastUnit) {
        html += '<p class="pt-2 text-[11px] font-extrabold uppercase tracking-widest text-slate-400 pl-1">' + esc(m.unit_label) + '</p>';
        lastUnit = m.unit_label;
      }
      var isCurrent = m.module_number === resumeWeek, isDone = w.pct === 100;
      var state = isDone ? '<span class="pill bg-teal-100 text-teal-800">Done</span>' : (isCurrent ? '<span class="pill bg-amber-100 text-amber-800">' + (w.done ? 'In progress' : 'Up next') + '</span>' : '');
      html += '<details class="week bg-white rounded-2xl border ' + (isCurrent ? 'border-teal-400 shadow-md' : 'border-slate-200') + ' overflow-hidden"' + (isCurrent ? ' open' : '') + '>' +
        '<summary class="flex items-center gap-4 px-4 sm:px-5 py-4">' +
          '<div class="ring' + (isDone ? ' done' : '') + (isCurrent ? ' next' : '') + '" style="--p:' + w.pct + '"><span>' + (isDone ? '✓' : (w.done ? w.pct + '%' : m.module_number)) + '</span></div>' +
          '<div class="min-w-0 flex-1"><div class="flex items-center gap-2 flex-wrap"><p class="font-bold text-slate-900">Week ' + esc(m.module_number) + ': ' + esc(m.title) + '</p>' + state + '</div>' +
          '<p class="text-xs text-slate-500 mt-0.5">' + (m.subtitle ? esc(m.subtitle) + ' · ' : '') + w.done + '/' + w.total + ' lessons' + (w.minutes ? ' · ' + minutesLabel(w.minutes) : '') + '</p></div>' +

  // Gated one-attempt quiz. One try, auto-graded, correct answers shown.
  // Pass (>= quiz_pass_pct, default 80) completes the lesson. Fail LOCKS the quiz
  // (DB trigger notifies the instructor) until an admin reopens it. All server-side
  // via quiz_attempts insert (RLS + trigger handle gating, alerts, best score).
  async function renderQuiz(lesson, mNum, lNum, slug, ctx) {
    var quiz = lesson.quiz_json;
    if (!quiz || !Array.isArray(quiz) || !quiz.length) return;
    var box = document.getElementById('quiz');
    var passPct = lesson.quiz_pass_pct || 80;
    var st = (await sb.from('quiz_status').select('state,best_score').eq('student_id', uid).eq('lesson_id', lesson.id).maybeSingle()).data;
    var last = (await sb.from('quiz_attempts').select('answers,score_pct').eq('student_id', uid).eq('lesson_id', lesson.id).order('created_at', { ascending: false }).limit(1).maybeSingle()).data;
    var state = st ? st.state : 'open';
    var reviewed = (state === 'passed' || state === 'locked');
    var byq = {};
    if (last && Array.isArray(last.answers)) last.answers.forEach(function (a) { byq[a.q_index] = a; });

    function questions(disabled) {
      var h = '<form id="quiz-form" class="mt-4 space-y-5">';
      quiz.forEach(function (q, qi) {
        h += '<fieldset><legend class="font-semibold text-slate-800 text-sm">' + (qi + 1) + '. ' + esc(q.question) + '</legend><div class="mt-2 space-y-1.5">';
        (q.choices || []).forEach(function (ch, ci) {
          var cls = 'flex items-center gap-2 text-sm text-slate-700 rounded px-1 py-0.5';
          var mark = '';
          if (reviewed) {
            if (ci === Number(q.correct_index)) { cls += ' bg-teal-50 text-teal-800'; mark = ' <span class="text-teal-600 text-xs font-bold">✓ correct</span>'; }
            else if (byq[qi] && byq[qi].chosen_index === ci) { cls += ' bg-rose-50 text-rose-700'; }
          }
          var checked = (reviewed && byq[qi] && byq[qi].chosen_index === ci) ? ' checked' : '';
          h += '<label class="' + cls + '"><input type="radio" name="q' + qi + '" value="' + ci + '"' + checked + (disabled ? ' disabled' : '') + '> ' + esc(ch) + mark + '</label>';
        });
        h += '</div>' + (reviewed && q.explanation ? '<p class="text-xs mt-1 text-slate-500"><b>Why:</b> ' + esc(q.explanation) + '</p>' : '') + '</fieldset>';
      });
      h += (disabled ? '' : '<button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold px-5 py-2 rounded-full text-sm">Submit my one attempt</button>') + '</form>';
      return h;
    }
    function shell(banner, disabled) {
      return '<section class="mt-8 bg-slate-50 rounded-2xl border border-slate-200 p-5 sm:p-6">' +
        '<div class="flex items-center justify-between"><h2 class="font-bold text-slate-900">Knowledge Check</h2>' +
        '<span class="text-xs text-slate-400 font-semibold">One attempt · pass ' + passPct + '%</span></div>' +
        (banner || '') + questions(disabled) + '</section>';
    }

    if (state === 'locked') {
      var sc = last ? last.score_pct : ((st && st.best_score) || 0);
      box.innerHTML = shell('<div class="mt-3 rounded-xl bg-rose-50 border border-rose-200 p-4"><p class="font-bold text-rose-800">Not passed — ' + sc + '%. This quiz is locked.</p><p class="text-sm text-rose-700 mt-1">Your instructor has been notified and will review this with you, then reopen it for one more attempt. The correct answers are shown below so you can start learning them now.</p></div>', true);
      return;
    }
    if (state === 'passed') {
      var ps = (st && st.best_score) || (last && last.score_pct) || '';
      box.innerHTML = shell('<div class="mt-3 rounded-xl bg-teal-50 border border-teal-200 p-4"><p class="font-bold text-teal-800">Passed — ' + ps + '%. Nice work.</p><p class="text-sm text-teal-700 mt-1">Correct answers are shown below for review.</p></div>', true);
      return;
    }
    box.innerHTML = shell('', false);
    document.getElementById('quiz-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      for (var i = 0; i < quiz.length; i++) { if (!document.querySelector('input[name="q' + i + '"]:checked')) { alert('Please answer every question — you only get one attempt.'); return; } }
      if (!confirm('Submit for grading? This is your ONE attempt. It is recorded, and you cannot retake it unless your instructor reopens it.')) return;
      var graded = quiz.map(function (q, qi) {
        var sel = document.querySelector('input[name="q' + qi + '"]:checked');
        var chosen = sel ? Number(sel.value) : -1;
        return { q_index: qi, chosen_index: chosen, correct_index: Number(q.correct_index), correct: chosen === Number(q.correct_index) };
      });
      var correct = graded.filter(function (g) { return g.correct; }).length;
      var score = Math.round(correct / quiz.length * 100);
      var passed = score >= passPct;
      var cnt = (await sb.from('quiz_attempts').select('id', { count: 'exact', head: true }).eq('student_id', uid).eq('lesson_id', lesson.id)).count || 0;
      var ins = await sb.from('quiz_attempts').insert({ student_id: uid, lesson_id: lesson.id, course_slug: slug, module_number: mNum, lesson_number: lNum, attempt_number: cnt + 1, score_pct: score, passed: passed, answers: graded });
      if (ins.error) { alert('Could not submit your quiz: ' + ins.error.message); return; }
      if (passed) markComplete(mNum, lNum, score, null, null, false, ctx);
      renderQuiz(lesson, mNum, lNum, slug, ctx);
      var q = document.getElementById('quiz'); if (q && q.scrollIntoView) q.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  // Saves progress, then celebrates and points at the next lesson (or the week /

  async function markComplete(mNum, lNum, quizScore, next, slug, silent, ctx) {

    if (quizScore != null) row.quiz_score = quizScore;
    var wasDone = ctx && ctx.cur && ctx.cur.l._done;
    try {
      var r = await sb.from('module_progress').upsert(row, { onConflict: 'student_id,module_number,lesson_number' });
      if (r && r.error) throw new Error(r.error.message);
      var btn = document.getElementById('complete-btn');
      if (btn) { btn.textContent = '✓ Completed'; btn.className = 'bg-teal-100 text-teal-800 font-semibold px-5 py-2.5 rounded-full text-sm'; }
      if (!silent && ctx && !wasDone) showDonePanel(ctx);
      if (ctx && ctx.cur) ctx.cur.l._done = true;
    } catch (e) { if (!silent) alert('Could not save your progress. Check your connection and tap Mark complete again.'); }
  }

      cta = ctx.course && ctx.course.cert_enabled !== false ? '<a href="/certificate?c=' + encodeURIComponent(ctx.slug) + '" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-5 py-2.5 rounded-full text-sm">Get my certificate →</a>' : '<a href="' + courseHref(ctx.slug) + '" class="bg-teal-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">Back to the course →</a>';

    } else if (n) {
      title = '✓ Lesson done. ' + (week ? (week.total - doneNow) + ' left this week.' : '');
      sub = 'Keep the momentum. Next: ' + n.l.title + (n.l.estimated_minutes ? ' (about ' + n.l.estimated_minutes + ' min)' : '') + '.';
      cta = '<a href="' + lessonHref(ctx.slug, n.m.module_number, n.l.lesson_number) + '" class="bg-teal-700 hover:bg-teal-800 text-white font-bold px-5 py-2.5 rounded-full text-sm">Next lesson →</a>';

    panel.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'center' });

  function celebrate() {
    if (reducedMotion()) return;
    var host = document.createElement('div'); host.className = 'burst'; host.setAttribute('aria-hidden', 'true');
    var em = ['🦷', '✨', '⭐', '🎉', '💙', '🎓'];
    for (var i = 0; i < 14; i++) { var s = document.createElement('span'); s.textContent = em[i % em.length]; var a = (i / 14) * Math.PI * 2; s.style.setProperty('--dx', Math.round(Math.cos(a) * (90 + Math.random() * 80)) + 'px'); s.style.setProperty('--dy', Math.round(Math.sin(a) * (70 + Math.random() * 60)) + 'px'); host.appendChild(s); }
    document.body.appendChild(host);
    setTimeout(function () { host.remove(); }, 1300);
  }

  function notFound() { return '<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center"><div class="text-4xl mb-3">🔍</div><h2 class="display text-xl font-bold">Course not found</h2><a href="/learn" class="inline-block mt-4 text-teal-700 font-semibold">← Back to my courses</a></div>'; }
  function locked(course) {
    var buy = course.entitlement_flag === 'career_vault' ? '/career-vault' : '/enroll';
    return '<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center"><div class="text-4xl mb-3">🔒</div><h2 class="display text-xl font-bold">This course isn\'t on your account yet</h2><p class="text-slate-500 mt-2 text-sm">' + esc(course.title) + ' is available once you have access.</p><a href="' + buy + '" class="inline-block mt-4 bg-teal-700 hover:bg-teal-800 text-white font-semibold px-5 py-2.5 rounded-full text-sm">Get access →</a></div>'; }
  function errorState(e) {
    return '<div class="bg-white rounded-2xl border border-rose-200 p-8 text-center"><div class="text-4xl mb-3">📶</div><h2 class="display text-xl font-bold">Could not load this page</h2><p class="text-slate-500 mt-2 text-sm">Check your connection and try again. If it keeps happening, text (903) 913-6444.</p><button id="retry-btn" class="inline-block mt-4 bg-teal-700 hover:bg-teal-800 text-white font-semibold px-5 py-2.5 rounded-full text-sm">Try again</button></div>';
  }

  function route() {
    var p = qp();
    var c = p.get('c'), m = p.get('m'), l = p.get('l');
    view.innerHTML = '<div class="py-16 text-center text-slate-400 text-sm"><div class="w-7 h-7 border-2 border-teal-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>Loading…</div>';
    var run = (c && m && l) ? renderLesson(c, Number(m), Number(l)) : (c ? renderOutline(c) : renderCatalog());
    run.catch(function (e) {
      view.innerHTML = errorState(e);
      var b = document.getElementById('retry-btn'); if (b) b.onclick = route;
    });
  }

  // Class-date lock: students enrolled in a future cohort see a "starts soon"
  // screen instead of content. (The database enforces this too — course_lessons
  // are unreadable before the earliest enrolled cohort's start_date.)
  function renderClassLock(startDate, cohortName) {
    var d = new Date(startDate + 'T00:00:00');
    var pretty = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    var days = Math.max(0, Math.round((d - new Date(new Date().toDateString())) / 86400000));
    view.innerHTML = '<div class="bg-white rounded-2xl border border-slate-200 p-10 text-center max-w-xl mx-auto">' +
      '<div class="text-5xl mb-4">🎒</div>' +
      '<h2 class="display text-2xl font-bold">Your class starts ' + esc(pretty) + '!</h2>' +
      '<p class="text-slate-600 mt-3">' + esc(cohortName || 'Your cohort') + ' begins in <b>' + days + ' day' + (days === 1 ? '' : 's') + '</b>. Chapters and quizzes unlock that morning so everyone starts together — no getting behind before day one.</p>' +
      '<p class="text-slate-500 mt-3 text-sm">In the meantime, the practice tools are all yours:</p>' +
      '<div class="mt-4 flex flex-wrap gap-3 justify-center">' +
      '<a href="/tools/charting-drills" class="bg-teal-700 hover:bg-teal-800 text-white font-semibold px-5 py-2.5 rounded-full text-sm">Charting Drills →</a>' +
      '<a href="/tools/flashcards" class="bg-white border-2 border-slate-300 hover:border-teal-600 text-slate-700 font-semibold px-5 py-2.5 rounded-lg text-sm">RDA Flashcards</a>' +
      '<a href="/tools" class="bg-white border-2 border-slate-300 hover:border-teal-600 text-slate-700 font-semibold px-5 py-2.5 rounded-lg text-sm">All tools</a>' +
      '</div></div>';
  }

  // Boot: need a session; enrolled/career_vault decide what shows.
  PDAPortal.getAccess().then(function (a) {
    if (!a.ok || !a.session) { location.href = '/login'; return; }
    access = a; uid = a.session.user.id;
    // Load career_vault flag (not part of the portal RPC) + first name for the greeting.
    sb.from('profiles').select('career_vault,is_admin,is_instructor,first_name').eq('id', uid).maybeSingle().then(function (r) {
      access.career_vault = !!(r.data && r.data.career_vault);
      access.first_name = (r.data && r.data.first_name) || null;
      var staff = !!(r.data && (r.data.is_admin || r.data.is_instructor));
      sb.from('enrollments').select('status, cohorts(name,start_date)').eq('student_id', uid).then(function (er) {
        var rows = (er.data || []).filter(function (e) {
          return ['cancelled','canceled','dropped','refunded'].indexOf(String(e.status || '').toLowerCase()) === -1 && e.cohorts && e.cohorts.start_date;
        });
        var earliest = rows.length ? rows.reduce(function (min, e) { return e.cohorts.start_date < min.cohorts.start_date ? e : min; }) : null;
        document.body.classList.add('pda-ready');
        var today = new Date().toISOString().slice(0, 10);
        if (!staff && earliest && earliest.cohorts.start_date > today) {
          renderClassLock(earliest.cohorts.start_date, earliest.cohorts.name);
          return;
        }
        route();
        window.addEventListener('popstate', route);
      });
    });
  });
})();
</script>
<script defer src="/assets/pda-track.js"></script>
</body>
</html>
